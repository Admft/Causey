# Twice-weekly tournament ingestion for runnable chess and category sources.
#
# Prerequisites:
#   1. Run Supabase migrations through 0055_txsef_source.sql.
#   2. Repo secrets (Settings → Secrets → Actions):
#        NEXT_PUBLIC_SUPABASE_URL
#        SUPABASE_SERVICE_ROLE_KEY
#      Must match the Causey Supabase project (same values as local .env).
#   3. Optional: OPENAI_API_KEY for pathway enrichment (gpt-4.1-mini)
#   4. Manual dry-run locally: npm run scrape:all && npm run scrape:discovery
#
# Schedule: Mondays and Thursdays 11:00 UTC (twice weekly).
# Also triggerable via Actions → Ingest tournaments → Run workflow.
name: Ingest tournaments

on:
  schedule:
    - cron: "0 11 * * 1,4"
  workflow_dispatch:
    inputs:
      source:
        description: Tournament source to ingest
        required: true
        default: all
        type: choice
        options:
          - all
          - tla_scrape
          - cca_scrape
          - onlinereg_scrape
          - chess_results_scrape
          - fide_calendar_scrape
          - tca_scrape
          - vex_events_scrape
          - taea_vase_scrape
          - bennington_writers_scrape
          - doe_science_bowl_scrape
          - afsa_essay_scrape
          - uil_theatre_scrape
          - uil_speech_debate_scrape
          - purple_comet_scrape
          - uil_music_marching_scrape
          - txsef_scrape

concurrency:
  group: causey-tournament-ingestion
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Supabase secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing Actions secrets NEXT_PUBLIC_SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY."
            echo "Add them under Repo Settings → Secrets and variables → Actions"
            echo "(use the same Causey project values as local .env)."
            exit 1
          fi
          echo "Supabase secrets present."
      - name: Scrape selected tournament source
        env:
          SCRAPER_SOURCE: ${{ inputs.source || 'all' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENRICH_MAX_AI: "80"
          ENRICH_BATCH_SIZE: "20"
          # Fail instead of silently staging-only when secrets are wrong.
          REQUIRE_SUPABASE: "1"
        run: |
          case "$SCRAPER_SOURCE" in
            all) npm run scrape:all && npm run scrape:discovery ;;
            tla_scrape) npm run scrape:tla ;;
            cca_scrape) npm run scrape:cca ;;
            onlinereg_scrape) npm run scrape:onlinereg ;;
            chess_results_scrape) npm run scrape:chess-results ;;
            fide_calendar_scrape) npm run scrape:fide ;;
            tca_scrape) npm run scrape:tca ;;
            vex_events_scrape) npm run scrape:vex ;;
            taea_vase_scrape) npm run scrape:taea-vase ;;
            bennington_writers_scrape) npm run scrape:bennington-writers ;;
            doe_science_bowl_scrape) npm run scrape:doe-science-bowl ;;
            afsa_essay_scrape) npm run scrape:afsa-essay ;;
            uil_theatre_scrape) npm run scrape:uil-theatre ;;
            uil_speech_debate_scrape) npm run scrape:uil-speech-debate ;;
            purple_comet_scrape) npm run scrape:purple-comet ;;
            uil_music_marching_scrape) npm run scrape:uil-music-marching ;;
            txsef_scrape) npm run scrape:txsef ;;
            *) echo "::error::Unknown scraper source: $SCRAPER_SOURCE"; exit 1 ;;
          esac
      - name: Verify purge dry-run safety
        if: github.event_name == 'schedule' || inputs.source == 'all'
        run: npm run verify:purge-dry-run
      - name: Purge competitions ended over a year ago
        if: github.event_name == 'schedule' || inputs.source == 'all'
        run: npm run purge:stale
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
