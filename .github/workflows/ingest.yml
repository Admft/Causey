# Scheduled and manual tournament ingestion for runnable chess and category sources.
#
# Prerequisites:
#   1. Run Supabase migrations through 0084_congressional_app_challenge_dispatch.sql.
#   2. Repo secrets (Settings → Secrets → Actions):
#        NEXT_PUBLIC_SUPABASE_URL
#        SUPABASE_SERVICE_ROLE_KEY
#      Must match the Causey Supabase project (same values as local .env).
#   3. Optional: OPENAI_API_KEY for pathway enrichment (gpt-4.1-mini)
#   4. Manual dry-run locally: npm run scrape:all && npm run scrape:discovery
#
# GitHub loads schedules from the default branch. The scheduled workflow is
# released on main but explicitly checks out dev, while manual runs remain
# restricted to dev.
name: Ingest tournaments

on:
  schedule:
    - cron: "0 11 * * 1,4"
  workflow_dispatch:
    inputs:
      source:
        description: Tournament source to ingest
        required: true
        default: all
        type: choice
        options:
          - all
          - tla_scrape
          - cca_scrape
          - onlinereg_scrape
          - chess_results_scrape
          - fide_calendar_scrape
          - tca_scrape
          - taea_vase_scrape
          - bennington_writers_scrape
          - afsa_essay_scrape
          - uil_theatre_scrape
          - uil_speech_debate_scrape
          - purple_comet_scrape
          - doe_science_bowl_scrape
          - uil_music_marching_scrape
          - txsef_scrape
          - congressional_app_challenge_scrape
      sources:
        description: Optional comma-separated governed subset (admin dispatch)
        required: false
        type: string

concurrency:
  group: causey-tournament-ingestion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Confirm approved workflow ref
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'dev'
        run: |
          echo "::error::Manual ingestion dispatch is approved only from dev."
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Supabase secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing Actions secrets NEXT_PUBLIC_SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY."
            echo "Add them under Repo Settings → Secrets and variables → Actions"
            echo "(use the same Causey project values as local .env)."
            exit 1
          fi
          echo "Supabase secrets present."
      - name: Scrape selected tournament source
        env:
          SCRAPER_SOURCES: ${{ github.event_name == 'schedule' && 'all' || inputs.sources || inputs.source || 'all' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENRICH_MAX_AI: "80"
          ENRICH_BATCH_SIZE: "20"
          # Fail instead of silently staging-only when secrets are wrong.
          REQUIRE_SUPABASE: "1"
        run: |
          run_source() {
            case "$1" in
              all) npm run scrape:all && npm run scrape:discovery ;;
              tla_scrape) npm run scrape:tla ;;
              cca_scrape) npm run scrape:cca ;;
              onlinereg_scrape) npm run scrape:onlinereg ;;
              chess_results_scrape) npm run scrape:chess-results ;;
              fide_calendar_scrape) npm run scrape:fide ;;
              tca_scrape) npm run scrape:tca ;;
              taea_vase_scrape) npm run scrape:taea-vase ;;
              bennington_writers_scrape) npm run scrape:bennington-writers ;;
              afsa_essay_scrape) npm run scrape:afsa-essay ;;
              uil_theatre_scrape) npm run scrape:uil-theatre ;;
              uil_speech_debate_scrape) npm run scrape:uil-speech-debate ;;
              purple_comet_scrape) npm run scrape:purple-comet ;;
              doe_science_bowl_scrape) npm run scrape:doe-science-bowl ;;
              uil_music_marching_scrape) npm run scrape:uil-music-marching ;;
              txsef_scrape) npm run scrape:txsef ;;
              congressional_app_challenge_scrape) npm run scrape:congressional-app-challenge ;;
              *) echo "::error::Unknown or blocked scraper source: $1"; exit 1 ;;
            esac
          }

          if [[ "$SCRAPER_SOURCES" == *,* && ",$SCRAPER_SOURCES," == *,all,* ]]; then
            echo "::error::The all source cannot be combined with a subset."
            exit 1
          fi

          IFS=',' read -ra SELECTED_SOURCES <<< "$SCRAPER_SOURCES"
          if [ "${#SELECTED_SOURCES[@]}" -eq 0 ]; then
            echo "::error::Select at least one governed scraper source."
            exit 1
          fi
          for source in "${SELECTED_SOURCES[@]}"; do
            run_source "$source"
          done
      - name: Verify purge dry-run safety
        if: github.event_name == 'schedule' || (inputs.source == 'all' && inputs.sources == '')
        run: npm run verify:purge-dry-run
      - name: Review stale-retention candidates without deleting
        if: github.event_name == 'schedule' || (inputs.source == 'all' && inputs.sources == '')
        run: PURGE_DRY_RUN=1 npm run purge:stale
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
