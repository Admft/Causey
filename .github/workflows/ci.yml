name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Validate migration filenames
        run: npm run validate:migrations
      - name: Verify purge dry-run safety
        run: npm run verify:purge-dry-run
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Clean production build
        env:
          DATA_SOURCE: mock
        run: rm -rf .next && npm run build
